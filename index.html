<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゼロから8小節</title>
<link rel="stylesheet" href="style.css">
</head>
<!-- body のクラスで「分割／タブ」「説明／作曲」を切り替える -->
<body class="mode-split show-daw">

  <!-- 上のバー -->
  <header class="topbar">
    <h1>ゼロから8小節</h1>
    <div class="switch book">
      <button id="book-compose" class="active">作曲編</button>
      <button id="book-arrange">編曲編</button>
    </div>
    <div class="spacer"></div>
    <span class="label">表示</span>
    <div class="switch">
      <button id="btn-tab">タブ</button>
      <button id="btn-split">分割</button>
    </div>
  </header>

  <!-- タブ（タブ表示のときだけ見える） -->
  <nav class="tabs">
    <button id="tab-explain">説明</button>
    <button id="tab-daw">作曲</button>
  </nav>

  <main class="workspace">
    <!-- 説明パネル -->
    <section id="explain" class="panel explain">
      <div class="explain-head">
        <p class="step-no" id="step-no"></p>
        <div class="spacer"></div>
        <button id="toc-btn" class="toc-btn">目次</button>
        <button id="glossary-btn" class="toc-btn">用語</button>
        <button id="chart-btn" class="toc-btn">早見表</button>
        <button id="qol-btn" class="toc-btn">QOL</button>
      </div>
      <!-- 目次・用語・本文（中身は lessons.js と glossary.js から parser.js が作る） -->
      <div id="toc" class="toc" hidden></div>
      <div id="glossary" class="toc" hidden></div>
      <div id="chart" class="toc" hidden></div>
      <div id="qol" class="toc lesson" hidden></div>
      <article id="lesson" class="lesson"></article>
      <div class="nav-buttons">
        <button id="prev">← 前へ</button>
        <button id="next" class="primary">次へ →</button>
      </div>
    </section>

    <!-- DAWパネル -->
    <section id="daw" class="panel daw">
      <div class="toolbar">
        <button id="play" class="play" aria-label="再生">▶</button>
        <button id="stop" aria-label="停止">■</button>
        <label>BPM <input id="bpm" type="number" min="40" max="240" value="120"></label>
        <label>グリッド
          <select id="grid">
            <option value="12">4分</option>
            <option value="6">8分</option>
            <option value="4">12分（8分三連）</option>
            <option value="3" selected>16分</option>
            <option value="2">24分（16分三連）</option>
            <option value="1">48分</option>
          </select>
        </label>
        <label>キー
          <select id="key">
            <option value="0">C</option>
            <option value="1">C#</option>
            <option value="2">D</option>
            <option value="3">D#</option>
            <option value="4">E</option>
            <option value="5">F</option>
            <option value="6">F#</option>
            <option value="7">G</option>
            <option value="8">G#</option>
            <option value="9">A</option>
            <option value="10">A#</option>
            <option value="11">B</option>
          </select>
        </label>
        <label>スケール
          <select id="scale">
            <option value="major">メジャー</option>
            <option value="minor">マイナー（ナチュラル）</option>
            <option value="harmonic">ハーモニックマイナー</option>
            <option value="melodic">メロディックマイナー</option>
            <option value="dorian">ドリアン</option>
            <option value="phrygian">フリジアン</option>
            <option value="lydian">リディアン</option>
            <option value="mixolydian">ミクソリディアン</option>
            <option value="locrian">ロクリアン</option>
            <option value="majpenta">メジャーペンタトニック</option>
            <option value="minpenta">マイナーペンタトニック</option>
            <option value="blues">ブルース</option>
          </select>
        </label>
        <label>コードを光らせる
          <select id="hl"></select>
        </label>
        <button id="clear">このトラックを消す</button>
        <label>ループ
          <select id="loop-from" aria-label="ループの始まりの小節"></select>〜<select id="loop-to" aria-label="ループの終わりの小節"></select>小節
        </label>
        <button id="metronome" aria-pressed="false" title="1拍ごとに「カッ」と鳴らす（書き出しには入らない）">メトロノーム</button>
        <button id="midi-in" title="MIDI キーボードをつなぐ">MIDI 鍵盤</button>
        <details id="filemenu" class="filemenu">
          <summary>ファイル</summary>
          <div class="filemenu-list">
            <button data-file="save">保存（.json）</button>
            <button data-file="open">開く（.json）</button>
            <button data-file="wav">WAV で書き出す</button>
            <button data-file="midi">MIDI で書き出す</button>
            <button data-file="new">新しく作る</button>
            <p>作ったものは、このブラウザに自動で保存されています</p>
          </div>
        </details>
        <input id="project-file" type="file" accept=".json,application/json" hidden>
      </div>

      <div class="daw-body">
        <div class="side">
          <!-- トラック一覧（中身は render.js が作る） -->
          <div id="tracks" class="tracks"></div>
          <div class="add-track">
            <button id="add-inst">＋ 楽器</button>
            <button id="add-synth">＋ シンセ</button>
            <button id="add-drum">＋ ドラム</button>
            <button id="add-fx">＋ FX</button>
          </div>
          <!-- ドラムのパッド（ドラムトラックを選んでいるときだけ出る） -->
          <div id="pads" class="pads" hidden></div>
          <!-- コードパッド（メロディ以外の楽器トラックを選んでいるときだけ出る） -->
          <div id="chordpads" class="pads" hidden></div>
          <input id="pad-file" type="file" accept="audio/*" hidden>
        </div>
        <!-- ピアノロール -->
        <div class="roll-wrap">
          <canvas id="roll"></canvas>
          <!-- シンセの編集画面（開いているときだけ、ピアノロールの上に重なる） -->
          <div id="synth" class="synth" hidden></div>
        </div>
      </div>

      <p class="hint">
        クリック：置く／消す　ドラッグ：移動　右端をドラッグ：長さ　スペース：再生／停止　Ctrl＋Z：元に戻す　A〜K：鍵盤（Z／X でオクターブ）　──　ほかの操作は説明パネルの「QOL」にまとめてあります
      </p>
    </section>
  </main>

  <!-- スマホで開いたときのお知らせ -->
  <div id="mobile-note" class="mobile-note" hidden>
    <p><b>パソコンで開いてください</b><br>このアプリはマウスとキーボードで操作するので、スマホだとほぼ使えません</p>
    <button id="mobile-ok">それでも見る</button>
  </div>

  <!-- 用語の説明（マウスを乗せると出る） -->
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <!-- 説明の文章：lesson(...) を呼ぶたびに1ステップ増える -->
  <!-- 用語辞典：term(...) を呼ぶたびに1語増える -->
  <script>
    const LESSON_SOURCES = [];
    function lesson(text) { LESSON_SOURCES.push(text); }
    const GLOSSARY = [];
    function term(names, text) { GLOSSARY.push({ names: names.split("|").map((s) => s.trim()), text: text }); }
    const ARRANGE_SOURCES = [];
    function arrange(text) { ARRANGE_SOURCES.push(text); }
    const QOL_SOURCES = [];
    function qol(text) { QOL_SOURCES.push(text); }
  </script>
  <script src="lessons.js"></script>
  <script src="arrange.js"></script>
  <script src="glossary.js"></script>
  <script src="qol.js"></script>
  <script src="synth.js"></script>
  <!-- アプリの本体（この順番で読み込む。上のファイルで作ったものを、下のファイルが使う） -->
  <script src="data.js"></script>
  <script src="sound.js"></script>
  <script src="edit.js"></script>
  <script src="parser.js"></script>
  <script src="chords.js"></script>
  <script src="render.js"></script>
  <script src="pianoroll.js"></script>
  <script src="events.js"></script>
  <script src="project.js"></script>
  <script src="input.js"></script>
  <script src="start.js"></script>
</body>
</html>
